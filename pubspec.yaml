publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  flutter_local_notifications: ^23.0.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  http: ^1.6.0
