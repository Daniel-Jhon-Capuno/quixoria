name: quixoria
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+21

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  http: ^1.6.0
  crypto: ^3.0.8
  web: ^1.1.2
  supabase: ^2.16.5
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  app_links: ^6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/mascot/
    - assets/sounds/
